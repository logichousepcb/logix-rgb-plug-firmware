; Logix RGB Plug: custom firmware for the RGB night-light smart plug (ESP8266EX, 1 MB).
; Installed over Tasmota's web OTA form using the gzipped image, see README.md.

[env:logixrgbplug]
platform = espressif8266 @ 4.2.1
board = esp01_1m
framework = arduino
board_build.flash_mode = dout
; 1 MB with a 64 KB LittleFS (settings, plug and light state). Tasmota's settings sectors 0xF4000-0xFB000
; are read once on first boot, before LittleFS is mounted, to import WiFi/MQTT, the name and the
; relay and light state.
board_build.ldscript = eagle.flash.1m64.ld
board_build.filesystem = littlefs
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DNDEBUG
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.1
; Writes firmware.bin.gz next to firmware.bin: Tasmota only has ~384 KB free for an upload.
extra_scripts = post:scripts/gzip_firmware.py
monitor_speed = 115200
upload_speed = 115200
